<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIKA 2 - Form Mahasiswa</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>SIKA 2</h1>
      <p>Sistem Informasi Akademik</p>
    </div>
  </header>

  <nav aria-label="Navigasi utama">
    <div class="container">
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="mahasiswa.html">Profil Mahasiswa</a></li>
        <li><a href="form-mahasiswa.html" aria-current="page">Form Mahasiswa</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <h2 class="page-title">Form Data Mahasiswa</h2>
    <p>Gunakan data dummy. Form belum menyimpan data ke server.</p>

    <!-- novalidate: validasi ditangani JavaScript (Bab 4). Atribut HTML5 tetap ada sebagai cadangan. -->
    <form id="formMahasiswa" action="#" method="post" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="nim">NIM (8 digit)</label>
          <input type="text" id="nim" name="nim" maxlength="8" inputmode="numeric" required aria-describedby="errorNim">
          <small id="errorNim" class="error-message" role="alert"></small>
        </div>
        <div class="form-group">
          <label for="angkatan">Angkatan</label>
          <input type="number" id="angkatan" name="angkatan" min="2020" max="2030" required aria-describedby="errorAngkatan">
          <small id="errorAngkatan" class="error-message" role="alert"></small>
        </div>
      </div>

      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" minlength="3" required aria-describedby="errorNama hitungNama">
        <small id="hitungNama" class="hint">0 karakter</small>
        <small id="errorNama" class="error-message" role="alert"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required aria-describedby="errorEmail">
        <small id="errorEmail" class="error-message" role="alert"></small>
      </div>

      <div class="form-group">
        <label for="prodi">Program Studi</label>
        <select id="prodi" name="prodi" required aria-describedby="errorProdi">
          <option value="">-- Pilih Program Studi --</option>
          <option value="TI">Teknik Informatika</option>
          <option value="SI">Sistem Informasi</option>
        </select>
        <small id="errorProdi" class="error-message" role="alert"></small>
      </div>

      <fieldset>
        <legend>Status Akademik</legend>
        <input type="radio" id="aktif" name="status" value="aktif" checked>
        <label for="aktif" class="inline-label">Aktif</label>
        <input type="radio" id="nonaktif" name="status" value="nonaktif">
        <label for="nonaktif" class="inline-label">Nonaktif</label>
      </fieldset>

      <div class="button-group">
        <button type="submit">Simpan</button>
        <button type="button" id="btnResetPesan" class="btn-secondary">Reset Pesan Validasi</button>
        <button type="button" id="btnBersihkan" class="btn-secondary">Bersihkan Form</button>
      </div>

      <p id="statusForm" class="status" role="status"></p>
    </form>

    <section class="card preview">
      <h2>Pratinjau Nama</h2>
      <p>Nama yang diketik ditampilkan sebagai teks biasa (bukan HTML):</p>
      <p><strong id="previewNama">-</strong></p>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 SIKA 2</p>
    </div>
  </footer>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
